name: Test

on: [push]

jobs:
  test:
    name: Test on destination ${{ matrix.configurations.destination }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        configurations:
          - destination: "platform=macOS"
            scheme: "Fetch-macOS"
            platform: "macOS"
          - destination: "platform=iOS Simulator,name=iPhone 16 Pro"
            scheme: "Fetch-iOS"
            platform: "iOS"
          - destination: "platform=tvOS Simulator,name=Apple TV"
            scheme: "Fetch-tvOS"
            platform: "tvOS"
    
    steps:
    - name: Xcode Select
      run: sudo xcode-select -s /Applications/Xcode_16.2.app

    - name: Checkout
      uses: actions/checkout@v4

    - name: Install ${{ matrix.configurations.platform }} platform
      if: matrix.configurations.platform != 'macOS'
      run: |
        for attempt in 1 2 3 4 5; do
          if xcodebuild -downloadPlatform ${{ matrix.configurations.platform }}; then
            exit 0
          fi
          echo "Attempt $attempt to download the ${{ matrix.configurations.platform }} platform failed, retrying in 30s..."
          sleep 30
        done
        exit 1

    - name: Run tests on ${{ matrix.configurations.destination }}
      run: xcodebuild -destination "${{ matrix.configurations.destination }}" -scheme "${{ matrix.configurations.scheme }}" test
